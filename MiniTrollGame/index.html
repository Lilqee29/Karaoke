<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TROLL.EXE — 1000 Levels of Pain</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --gb-screen: #9bbc0f;
            --gb-text: #0f380f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--gb-screen);
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            align-items: flex-end; /* Prioritize the ground area */
            justify-content: center;
        }

        #screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center bottom;
            image-rendering: pixelated;
        }

    </style>
</head>
<body>
    <canvas id="screen"></canvas>

    <script src="engine/core.js"></script>
    <script>
        // ── Gem Rewards & High Score (v4.0) ──────────────────────────────────
        const TrollSave = {
            gems: parseInt(localStorage.getItem('trollGems')) || 0,
            highLevel: parseInt(localStorage.getItem('trollHighLevel')) || 1,

            addGems: function(amount) {
                this.gems += amount;
                localStorage.setItem('trollGems', this.gems);
                // Also add to parent OS gems
                try { window.parent.addGems(amount); } catch(e) {}
                this.updateHUD();
            },

            updateHigh: function(level) {
                if (level > this.highLevel) {
                    this.highLevel = level;
                    localStorage.setItem('trollHighLevel', this.highLevel);
                }
                this.updateHUD();
            },

            updateHUD: function() {
                try {
                    const pDoc = window.parent.document;
                    const gemsEl = pDoc.getElementById('mainTrollGems');
                    const hiEl = pDoc.getElementById('mainTrollHi');
                    if (gemsEl) gemsEl.textContent = `💎 ${this.gems}`;
                    if (hiEl) hiEl.textContent = `HI: ${this.highLevel}`;
                } catch(e) {}
            }
        };

        // Patch TrollEngine.nextLevel to award gems
        const _origNextLevel = TrollEngine.nextLevel.bind(TrollEngine);
        TrollEngine.nextLevel = function() {
            if (this.level >= 1000) {
                this.won = true;
                return;
            }
            // Award gems: 5 base + up to 10 bonus for fewer deaths
            const baseGems = 5;
            const bonusGems = Math.max(0, 10 - this.deaths);
            TrollSave.addGems(baseGems + bonusGems);
            TrollSave.updateHigh(this.level + 1);

            // Win flash
            const frame = document.getElementById('gbFrame');
            if (frame) {
                frame.classList.remove('win-flash');
                void frame.offsetWidth;
                frame.classList.add('win-flash');
                frame.addEventListener('animationend', () => frame.classList.remove('win-flash'), {once:true});
            }

            this.level++;
            this.loadLevel(this.level);
        };

        // Update HUD on boot
        TrollSave.updateHUD();

        // ── Touch + Mouse D-Pad bridge ───────────────────────────────────────
        const dpadState = {};
        function dpadPress(key) {
            if (dpadState[key]) return;
            dpadState[key] = true;
            const btn = { up:'btnUp', left:'btnLeft', right:'btnRight', down:'btnDown', jump:'btnA', b:'btnB' }[key];
            if (btn) document.getElementById(btn)?.classList.add('pressed');
            TrollEngine.touchInput(key, true);
        }
        function dpadRelease(key) {
            if (!dpadState[key]) return;
            dpadState[key] = false;
            const btn = { up:'btnUp', left:'btnLeft', right:'btnRight', down:'btnDown', jump:'btnA', b:'btnB' }[key];
            if (btn) document.getElementById(btn)?.classList.remove('pressed');
            TrollEngine.touchInput(key, false);
        }

        // Add mouse support to buttons that only have touch events
        document.querySelectorAll('.dpad-btn, .game-btn').forEach(btn => {
            const keyMap = {
                'btnUp': 'up', 'btnDown': 'down', 'btnLeft': 'left', 'btnRight': 'right',
                'btnA': 'jump', 'btnB': 'b'
            };
            const key = keyMap[btn.id];
            if (key) {
                btn.addEventListener('mousedown', () => dpadPress(key));
                btn.addEventListener('mouseup', () => dpadRelease(key));
                btn.addEventListener('mouseleave', () => dpadRelease(key));
            }
        });

        // ── Level jump ───────────────────────────────────────────────────────
        function jumpToLevel() {
            const v = parseInt(document.getElementById('lvlInput').value);
            if (v >= 1 && v <= 1000) {
                TrollEngine.level = v;
                TrollEngine.loadLevel(v);
            }
        }
    </script>
</body>
</html>
