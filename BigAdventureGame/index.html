<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Crystal of Dawn</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            object-fit: fill;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #000;
        }
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(rgba(18, 16, 16, 0) 0, rgba(18, 16, 16, 0.05) 50%, rgba(18, 16, 16, 0) 100%);
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.4;
        }
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.4) 150%);
            pointer-events: none;
            z-index: 101;
        }
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="320" height="240"></canvas>
    <div class="crt-overlay"></div>
    <div class="vignette"></div>
    <div id="uiLayer"></div>

    <script src="pixel-engine/core.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
